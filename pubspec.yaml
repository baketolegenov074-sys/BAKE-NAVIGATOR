name: bake_navigator
description: GPS navigator for Kazakhstan based on OpenStreetMap
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.8
  flutter_map: 7.0.2
  maplibre_gl: 0.25.0
  flutter_map_mbtiles: 1.0.4
  mbtiles: ^0.4.2
  vector_map_tiles: ^8.0.0
  vector_map_tiles_mbtiles: 1.2.0
  vector_tile_renderer: ^5.2.0
  file_picker: 8.1.7
  path_provider: 2.1.4
  latlong2: 0.9.1
  geolocator: 13.0.1
  flutter_tts: 4.2.0
  archive: ^3.6.1
  audioplayers: ^5.2.1
  sherpa_onnx: 2.0.1
  http: 1.2.2
  dio: ^5.7.0
  shared_preferences: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/kazakhstan_speed_cameras.csv
    - assets/data/shymkent_camera_candidates.csv
    - assets/data/shymkent_cameras.json
    - assets/data/shymkent_search.json.gz
