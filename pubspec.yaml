name: bake_navigator
description: GPS navigator for Kazakhstan based on OpenStreetMap
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.8
  flutter_map: 7.0.2
  mbtiles: ^0.4.2
  sqlite3_flutter_libs: ^0.5.24
  vector_map_tiles: ^8.0.0
  vector_map_tiles_mbtiles: 1.2.0
  vector_tile_renderer: ^5.2.0
  file_picker: 8.1.7
  path_provider: 2.1.4
  latlong2: 0.9.1
  geolocator: 13.0.1
  flutter_compass: 0.8.1
  flutter_tts: 4.2.0
  speech_to_text: ^7.3.0
  crypto: ^3.0.6
  http: 1.2.2
  shared_preferences: 2.3.2
  share_plus: ^10.1.4
  supabase_flutter: ^2.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/kazakhstan_speed_cameras.csv
    - assets/data/shymkent_camera_candidates.csv
    - assets/data/shymkent_cameras.json
    - assets/data/shymkent_search.json.gz
