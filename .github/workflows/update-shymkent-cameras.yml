name: Download Shymkent cameras

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download Shymkent OSM camera data
        run: python scripts/download_shymkent_cameras.py

      - name: Validate downloaded JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("assets/data/shymkent_cameras.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          cameras = data.get("cameras", [])
          if not isinstance(cameras, list) or not cameras:
              raise SystemExit("Нет камер: файл не будет опубликован.")
          for item in cameras:
              lat = float(item["latitude"])
              lon = float(item["longitude"])
              if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                  raise SystemExit(f"Некорректные координаты OSM: {item}")
          print(f"Проверено объектов OSM: {len(cameras)}")
          print("Скоростные камеры:", sum(x.get("highway") == "speed_camera" for x in cameras))
          print("Объекты surveillance:", sum(x.get("man_made") == "surveillance" for x in cameras))
          PY

      - name: Commit updated camera data
        run: |
          if git diff --quiet -- assets/data/shymkent_cameras.json; then
            echo "Данные не изменились; новый коммит не нужен."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/shymkent_cameras.json
          git commit -m "Update Shymkent camera data from OpenStreetMap"
          git push origin "HEAD:${{ github.ref_name }}"
