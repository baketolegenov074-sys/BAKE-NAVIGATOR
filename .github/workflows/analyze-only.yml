name: Analyze BAKE Navigator (no APK)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/address-gps-route-reset

permissions:
  contents: read

jobs:
  analyze:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Build bundled offline Shymkent address and POI index
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          sources=(
            "https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf"
            "https://download-ext2.geofabrik.de/asia/kazakhstan-latest.osm.pbf"
          )
          downloaded=false
          for source in "${sources[@]}"; do
            echo "Trying OSM source: ${source}"
            rm -f kazakhstan-latest.osm.pbf
            if curl --fail --location --retry 2 --retry-all-errors \
              --retry-delay 5 --connect-timeout 30 --max-time 1800 \
              "${source}" --output kazakhstan-latest.osm.pbf \
              && test -s kazakhstan-latest.osm.pbf; then
              downloaded=true
              echo "OSM source downloaded successfully: ${source}"
              break
            fi
            echo "OSM source unavailable; trying the next source."
          done
          if [ "${downloaded}" != true ]; then
            echo "::error::Could not download Kazakhstan OSM data from any configured source."
            exit 1
          fi
          osmium fileinfo kazakhstan-latest.osm.pbf
          osmium extract \
            --bbox 69.35,42.12,69.90,42.53 \
            --strategy smart \
            --output shymkent-search.osm.pbf \
            kazakhstan-latest.osm.pbf
          osmium tags-filter \
            --output shymkent-search-features.osm.pbf \
            shymkent-search.osm.pbf \
            nwr/name nwr/name:ru nwr/name:kk nwr/name:en \
            nwr/official_name nwr/short_name nwr/alt_name nwr/brand \
            nwr/operator nwr/ref nwr/amenity=school \
            nwr/addr:housenumber nwr/addr:street nwr/addr:place
          osmium export \
            --output-format=geojsonseq \
            --format-option=print_record_separator=false \
            --output=shymkent-search.geojsonseq \
            shymkent-search-features.osm.pbf
          python3 scripts/build_shymkent_search_index.py \
            --input shymkent-search.geojsonseq \
            --output assets/data/shymkent_search.json.gz
          test -s assets/data/shymkent_search.json.gz
          gzip -t assets/data/shymkent_search.json.gz
          ls -lh assets/data/shymkent_search.json.gz

      - name: Download Kazakhstan offline speed-camera database
        run: |
          mkdir -p assets/data
          curl --fail --location --retry 3 --retry-delay 2 \
            https://speedcams.world/downloads/kz/kz-all.csv \
            --output assets/data/kazakhstan_speed_cameras.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          path = Path("assets/data/kazakhstan_speed_cameras.csv")
          with path.open(encoding="utf-8-sig", newline="") as stream:
              rows = list(csv.DictReader(stream))
          if len(rows) < 100:
              raise SystemExit(f"Camera dataset looks incomplete: only {len(rows)} rows")
          for row in rows:
              lat, lon = float(row["latitude"]), float(row["longitude"])
              if not (40 <= lat <= 56 and 46 <= lon <= 88):
                  raise SystemExit(f"Out-of-country coordinate: {lat}, {lon}")
              if row.get("country_code") != "KZ":
                  raise SystemExit("Dataset contains a non-Kazakhstan record")
          print(f"Validated {len(rows)} Kazakhstan camera coordinates")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Analyze Flutter code only
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-valhalla-routing-tiles:
    name: Build Shymkent Valhalla routing tiles
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-shymkent-valhalla-tiles.yml
