name: Analyze BAKE Navigator (no APK)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/address-gps-route-reset

permissions:
  contents: read

jobs:
  analyze:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Analyze Flutter code only
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-valhalla-routing-tiles:
    name: Build Shymkent Valhalla routing tiles
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-shymkent-valhalla-tiles.yml
