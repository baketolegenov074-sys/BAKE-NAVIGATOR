name: Analyze BAKE Navigator (no APK)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/address-gps-route-reset

permissions:
  contents: read

jobs:
  analyze:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare optional generated assets for CI
        run: |
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path

          data_dir = Path("assets/data")
          data_dir.mkdir(parents=True, exist_ok=True)

          # These files are generated by the dedicated data/build workflows.
          # Keep real files when present; create harmless empty fallbacks only
          # in this temporary CI checkout so Flutter can bundle declared assets.
          optional_assets = {
              data_dir / "kazakhstan_speed_cameras.csv": "id,latitude,longitude,speed\\n",
          }
          for path, content in optional_assets.items():
              if not path.exists():
                  path.write_text(content, encoding="utf-8")

          search_index = data_dir / "shymkent_search.json.gz"
          if not search_index.exists():
              with gzip.open(search_index, "wt", encoding="utf-8") as stream:
                  json.dump({"items": []}, stream)
          PY

      - name: Test Shymkent search-index generation
        run: python3 test/search_index_test.py -v

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Analyze Flutter code only
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
