name: Build Kazakhstan Offline Vector Map

on:
  workflow_dispatch:
  push:
    branches:
      - fix/address-gps-route-reset
    paths:
      - .github/workflows/build-shymkent-offline-map.yml
  schedule:
    - cron: "25 3 1 * *"

permissions:
  contents: write

concurrency:
  group: kazakhstan-offline-vector-map
  cancel-in-progress: false

jobs:
  build-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout BAKE Navigator
        uses: actions/checkout@v4

      - name: Install map build dependencies
        run: |
          set -euo pipefail
          # GitHub runner image may contain a broken Microsoft feed; it is not needed here.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential cmake git curl jq sqlite3 libboost-all-dev liblua5.3-dev lua5.3 libshp-dev libsqlite3-dev rapidjson-dev

      - name: Download Kazakhstan OSM extract with mirrors
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="kazakhstan-latest.osm.pbf"
          SOURCES=(
            "https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf"
            "https://download-ext2.geofabrik.de/asia/kazakhstan-latest.osm.pbf"
            "https://data.bbbike.org/osm/pbf/region/asia/kazakhstan.osm.pbf"
          )
          downloaded=0
          for URL in "${SOURCES[@]}"; do
            echo "Trying OSM source: $URL"
            if curl --fail --location --retry 2 --retry-all-errors --retry-delay 8 --connect-timeout 30 --max-time 1800 "$URL" -o "$OUTPUT.tmp"; then
              if [ -s "$OUTPUT.tmp" ]; then
                mv "$OUTPUT.tmp" "$OUTPUT"
                echo "Downloaded from: $URL"
                downloaded=1
                break
              fi
            fi
            rm -f "$OUTPUT.tmp"
          done
          test "$downloaded" -eq 1 || { echo "All Kazakhstan OSM sources failed"; exit 1; }
          test -s "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Build Tilemaker
        run: |
          git clone --depth 1 https://github.com/systemed/tilemaker.git /tmp/tilemaker
          make -C /tmp/tilemaker -j2
          /tmp/tilemaker/tilemaker --help

      - name: Configure zoom levels 5-17 for all Kazakhstan
        run: |
          jq '
            .settings.minzoom = 5
            | .settings.maxzoom = 17
            | .settings.basezoom = 17
            | .settings.combine_below = 14
            | .settings.name = "BAKE Navigator - Kazakhstan"
            | .settings.version = "1.0"
            | .settings.description = "Offline OpenStreetMap vector map for all Kazakhstan"
            | .settings.filemetadata.attribution = "© OpenStreetMap contributors"
            | .layers |= with_entries(.value.maxzoom = 17)
            | .layers.housenumber.minzoom = 14
            | .layers.building.minzoom = 13
          ' /tmp/tilemaker/resources/config-openmaptiles.json > /tmp/config-kazakhstan.json

      - name: Generate Kazakhstan vector MBTiles
        run: |
          /tmp/tilemaker/tilemaker \
            --input kazakhstan-latest.osm.pbf \
            --output kazakhstan.mbtiles \
            --config /tmp/config-kazakhstan.json \
            --process /tmp/tilemaker/resources/process-openmaptiles.lua \
            --store /tmp/tilemaker-store \
            --threads 2
          test -s kazakhstan.mbtiles

      - name: Validate Kazakhstan MBTiles database
        run: |
          set -euo pipefail
          sqlite3 kazakhstan.mbtiles "PRAGMA integrity_check;" | grep -qx ok
          TILE_COUNT="$(sqlite3 kazakhstan.mbtiles 'SELECT COUNT(*) FROM tiles;')"
          test "$TILE_COUNT" -gt 0
          echo "Vector tile count: $TILE_COUNT"
          sqlite3 kazakhstan.mbtiles "SELECT zoom_level, COUNT(*) FROM tiles GROUP BY zoom_level ORDER BY zoom_level;"
          META_JSON="$(sqlite3 kazakhstan.mbtiles "SELECT value FROM metadata WHERE name='json';")"
          python3 - "$META_JSON" <<'PY'
          import json
          import sys
          metadata = json.loads(sys.argv[1])
          layers = metadata.get("vector_layers", [])
          ids = {layer.get("id") for layer in layers}
          road = next((layer for layer in layers if layer.get("id") == "transportation_name"), None)
          if road is None:
              raise SystemExit("MBTiles has no transportation_name vector layer")
          fields = sorted((road.get("fields") or {}).keys())
          if not {"name", "name:latin", "name:nonlatin"}.intersection(fields):
              raise SystemExit(f"transportation_name has no usable name field: {fields}")
          print("Street labels validated:", ", ".join(fields))
          print("Available vector layers:", ", ".join(sorted(ids)))
          PY
          mkdir -p output
          cp kazakhstan.mbtiles output/kazakhstan.mbtiles
          cat > output/README_RU.txt <<'EOF'
          BAKE Navigator — офлайн-векторная карта всего Казахстана
          Территория: Казахстан, данные OpenStreetMap.
          Источник данных: © OpenStreetMap contributors, лицензия ODbL.
          Формат: MBTiles, векторные тайлы PBF.
          Зумы: 5–17. Названия улиц: transportation_name.
          Здания и номера домов включаются там, где они присутствуют в исходных данных OSM.
          Пакет содержит картографические тайлы; граф маршрутизации и индекс поиска отдельно.
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAKE-Kazakhstan-Vector-MBTiles
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Split map for GitHub Release asset limit
        run: |
          set -euo pipefail
          mkdir -p output/release-parts
          split -b 1800M -d -a 2 output/kazakhstan.mbtiles output/release-parts/kazakhstan.mbtiles.part-
          ls -lh output/release-parts/

      - name: Publish latest map package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="kazakhstan-map-latest"
          cat >> output/README_RU.txt <<'EOF'

          В GitHub Release карта разделена на части из-за ограничения размера одного файла.
          Для восстановления исходного MBTiles объедините части по порядку:
          Linux/macOS: cat kazakhstan.mbtiles.part-* > kazakhstan.mbtiles
          Windows CMD: copy /b kazakhstan.mbtiles.part-00+kazakhstan.mbtiles.part-01 kazakhstan.mbtiles
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/release-parts/kazakhstan.mbtiles.part-* output/README_RU.txt --clobber
            gh release edit "$TAG" --title "BAKE Navigator — Kazakhstan offline vector map" --notes "Офлайн-векторная карта всего Казахстана. © OpenStreetMap contributors, ODbL. Зумы 5–17. Файл разделён на части менее 2 ГиБ."
          else
            gh release create "$TAG" output/release-parts/kazakhstan.mbtiles.part-* output/README_RU.txt --title "BAKE Navigator — Kazakhstan offline vector map" --notes "Офлайн-векторная карта всего Казахстана. © OpenStreetMap contributors, ODbL. Зумы 5–17. Файл разделён на части менее 2 ГиБ."
          fi
