name: Build Shymkent Offline Map

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 1 * *"

permissions:
  contents: write

concurrency:
  group: shymkent-offline-map
  cancel-in-progress: false

jobs:
  build-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout BAKE Navigator
        uses: actions/checkout@v4

      - name: Install map build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl jq sqlite3 osmium-tool libboost-all-dev liblua5.3-dev libshp-dev libsqlite3-dev rapidjson-dev

      - name: Download current Kazakhstan OSM extract
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 "$URL" -o kazakhstan-latest.osm.pbf
          test -s kazakhstan-latest.osm.pbf
          osmium fileinfo kazakhstan-latest.osm.pbf

      - name: Resolve OSM administrative boundary of Shymkent city
        run: |
          set -euo pipefail
          python3 scripts/resolve_shymkent_city_boundary.py
          test -s shymkent-city-boundary.geojson
          cat shymkent-city-boundary.geojson | jq -e '.features | (length == 1) and (.[0].geometry.type == "MultiPolygon" or .[0].geometry.type == "Polygon")'

      - name: Extract only the Shymkent city polygon
        run: |
          set -euo pipefail
          osmium extract --polygon shymkent-city-boundary.geojson --strategy smart --output shymkent-city.osm.pbf kazakhstan-latest.osm.pbf
          test -s shymkent-city.osm.pbf
          osmium fileinfo shymkent-city.osm.pbf

      - name: Build Tilemaker
        run: |
          git clone --depth 1 https://github.com/systemed/tilemaker.git /tmp/tilemaker
          make -C /tmp/tilemaker -j2
          /tmp/tilemaker/tilemaker --help

      - name: Configure zoom levels 10-17
        run: |
          jq '
            .settings.minzoom = 10
            | .settings.maxzoom = 17
            | .settings.basezoom = 17
            | .settings.combine_below = 17
            | .settings.name = "BAKE Navigator - Shymkent"
            | .settings.version = "1.0"
            | .settings.description = "Offline OpenStreetMap vector map for Shymkent city"
            | .settings.filemetadata.attribution = "© OpenStreetMap contributors"
            | .layers |= with_entries(.value.maxzoom = 17)
            | .layers.housenumber.minzoom = 14
            | .layers.building.minzoom = 13
          ' /tmp/tilemaker/resources/config-openmaptiles.json > /tmp/config-shymkent.json

      - name: Generate MBTiles
        run: |
          /tmp/tilemaker/tilemaker \
            --input shymkent-city.osm.pbf \
            --output shymkent.mbtiles \
            --config /tmp/config-shymkent.json \
            --process /tmp/tilemaker/resources/process-openmaptiles.lua \
            --store /tmp/tilemaker-store \
            --threads 2
          test -s shymkent.mbtiles

      - name: Validate MBTiles database
        run: |
          set -euo pipefail
          sqlite3 shymkent.mbtiles "PRAGMA integrity_check;" | grep -qx ok
          TILE_COUNT="$(sqlite3 shymkent.mbtiles 'SELECT COUNT(*) FROM tiles;')"
          test "$TILE_COUNT" -gt 0
          sqlite3 shymkent.mbtiles "SELECT zoom_level, COUNT(*) FROM tiles GROUP BY zoom_level ORDER BY zoom_level;"
          META_JSON="$(sqlite3 shymkent.mbtiles "SELECT value FROM metadata WHERE name='json';")"
          python3 - "$META_JSON" <<'PY'
          import json
          import sys
          metadata = json.loads(sys.argv[1])
          layers = metadata.get("vector_layers", [])
          road = next((layer for layer in layers if layer.get("id") == "transportation_name"), None)
          if road is None:
              raise SystemExit("MBTiles has no transportation_name vector layer")
          fields = sorted((road.get("fields") or {}).keys())
          if not {"name", "name:latin", "name:nonlatin"}.intersection(fields):
              raise SystemExit(f"transportation_name has no usable name field: {fields}")
          print("Street labels validated:", ", ".join(fields))
          PY
          mkdir -p output
          cp shymkent.mbtiles output/shymkent.mbtiles
          cp shymkent-city-boundary.geojson output/shymkent-city-boundary.geojson
          cat > output/README_RU.txt <<'EOF'
          BAKE Navigator — офлайн-векторная карта города Шымкента
          Территория: административный полигон города Шымкента из OpenStreetMap.
          Туркестанская область в пакет не входит.
          Источник данных: © OpenStreetMap contributors, лицензия ODbL.
          Формат: MBTiles, векторные тайлы PBF.
          Зумы: 10–17. Названия улиц: transportation_name.
          Пакет содержит только картографические тайлы; граф маршрутизации и индекс поиска отдельно.
          Файл shymkent-city-boundary.geojson содержит использованную границу города.
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAKE-Shymkent-City-MBTiles
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest map package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="shymkent-map-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/shymkent.mbtiles output/shymkent-city-boundary.geojson output/README_RU.txt --clobber
            gh release edit "$TAG" --title "BAKE Navigator — Shymkent city offline map" --notes "Офлайн-векторная карта административной территории города Шымкента. © OpenStreetMap contributors, ODbL. Зумы 10–17."
          else
            gh release create "$TAG" output/shymkent.mbtiles output/shymkent-city-boundary.geojson output/README_RU.txt --title "BAKE Navigator — Shymkent city offline map" --notes "Офлайн-векторная карта административной территории города Шымкента. © OpenStreetMap contributors, ODbL. Зумы 10–17."
          fi
