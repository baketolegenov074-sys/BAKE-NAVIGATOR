name: Build BAKE Navigator APK
# Triggered after the approved offline street-label and road-width updates.
# Build requested after road-report Supabase diagnostics and retry fixes.
# Rebuild after shortest-distance routing preference update and ISSAI engine removal.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/address-gps-route-reset

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build bundled offline Shymkent address and POI index
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          OUTPUT="kazakhstan-latest.osm.pbf"
          TEMP="kazakhstan-latest.download.osm.pbf"
          SOURCES=(
            "https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf"
            "https://data.bbbike.org/osm/pbf/region/asia/kazakhstan.osm.pbf"
          )
          downloaded=false
          rm -f "$TEMP" "$OUTPUT"
          for source in "${SOURCES[@]}"; do
            echo "Trying OSM source: ${source}"
            if curl --fail --location --silent --show-error \
              --retry 2 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 1800 \
              "${source}" --output "$TEMP"; then
              if test -s "$TEMP" && osmium fileinfo "$TEMP"; then
                mv "$TEMP" "$OUTPUT"
                downloaded=true
                echo "Validated Kazakhstan OSM PBF downloaded from ${source}"
                break
              fi
              echo "Downloaded OSM file failed validation."
            else
              echo "OSM source unavailable; trying next mirror."
            fi
            rm -f "$TEMP"
          done
          if [ "$downloaded" != true ]; then
            echo "::error::No valid Kazakhstan OSM source was reachable (Geofabrik and BBBike failed)."
            exit 1
          fi
          osmium extract \
            --bbox 69.35,42.12,69.90,42.53 \
            --strategy smart \
            --output shymkent-search.osm.pbf \
            "$OUTPUT"
          osmium tags-filter \
            --output shymkent-search-features.osm.pbf \
            shymkent-search.osm.pbf \
            nwr/name nwr/name:ru nwr/name:kk nwr/name:en nwr/name:latin \
            nwr/official_name nwr/official_name:ru nwr/official_name:kk \
            nwr/short_name nwr/alt_name nwr/alt_name:ru nwr/alt_name:kk \
            nwr/loc_name nwr/old_name nwr/int_name nwr/brand nwr/brand:ru \
            nwr/operator nwr/ref nwr/highway \
            nwr/amenity nwr/shop nwr/healthcare nwr/healthcare:speciality \
            nwr/speciality nwr/tourism nwr/leisure nwr/office \
            nwr/landuse=retail nwr/building=retail nwr/building=school \
            nwr/public_transport nwr/railway nwr/natural nwr/historic \
            nwr/addr:housenumber nwr/addr:street nwr/addr:place \
            nwr/addr:suburb nwr/addr:district nwr/addr:city \
            nwr/addr:postcode nwr/addr:full
          osmium export \
            --output-format=geojsonseq \
            --format-option=print_record_separator=false \
            --output=shymkent-search.geojsonseq \
            shymkent-search-features.osm.pbf
          python3 scripts/build_shymkent_search_index.py \
            --input shymkent-search.geojsonseq \
            --output assets/data/shymkent_search.json.gz
          test -s assets/data/shymkent_search.json.gz
          gzip -t assets/data/shymkent_search.json.gz
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path

          path = Path("assets/data/shymkent_search.json.gz")
          with gzip.open(path, "rt", encoding="utf-8") as source:
              index = json.load(source)
          items = index.get("items", [])
          streets = sum(item.get("kind") == "street" for item in items)
          addresses = sum(item.get("kind") in ("address", "entrance") for item in items)
          if not items or streets == 0:
              raise SystemExit(
                  f"Offline search index is incomplete: {len(items)} records, "
                  f"{streets} named streets, {addresses} addresses"
              )
          print(
              f"Offline search validated: {len(items)} records; "
              f"{streets} named streets; {addresses} addresses"
          )
          PY
          ls -lh assets/data/shymkent_search.json.gz

      - name: Validate OpenMapTiles source schema and Cyrillic glyphs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            https://tiles.openfreemap.org/styles/liberty \
            --output /tmp/liberty-style.json
          SOURCE_URL="$(jq -r '[.sources[] | select(.type == "vector") | .url // empty][0] // empty' /tmp/liberty-style.json)"
          if [ -z "$SOURCE_URL" ]; then
            echo "::error::OpenFreeMap Liberty style has no vector TileJSON URL"
            exit 1
          fi
          curl --fail --location --retry 3 --retry-all-errors \
            "$SOURCE_URL" --output /tmp/openfreemap-tilejson.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("/tmp/openfreemap-tilejson.json").read_text())
          layers = metadata.get("vector_layers", [])
          road = next((layer for layer in layers if layer.get("id") == "transportation_name"), None)
          if road is None:
              raise SystemExit("OpenFreeMap tiles have no transportation_name vector layer")
          fields = sorted((road.get("fields") or {}).keys())
          if "name" not in fields:
              raise SystemExit(f"transportation_name has no name field; fields={fields}")
          print("Online source-layer: transportation_name")
          print("Online road-label fields: " + ", ".join(fields))
          PY
          GLYPH_URL='https://fonts.openmaptiles.org/Noto%20Sans%20Regular/1024-1279.pbf'
          STATUS="$(curl --silent --show-error --location --retry 3 --retry-all-errors \
            --output /tmp/cyrillic-glyphs.pbf --write-out '%{http_code}' "$GLYPH_URL")"
          test "$STATUS" = "200"
          test -s /tmp/cyrillic-glyphs.pbf
          echo "Cyrillic glyph test: HTTP $STATUS, $(wc -c </tmp/cyrillic-glyphs.pbf) bytes"
          echo "Glyph template: https://fonts.openmaptiles.org/{fontstack}/{range}.pbf"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Download Kazakhstan offline speed-camera database
        run: |
          mkdir -p assets/data
          curl --fail --location --retry 3 --retry-delay 2 \
            https://speedcams.world/downloads/kz/kz-all.csv \
            --output assets/data/kazakhstan_speed_cameras.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          path = Path("assets/data/kazakhstan_speed_cameras.csv")
          with path.open(encoding="utf-8-sig", newline="") as stream:
              rows = list(csv.DictReader(stream))
          if len(rows) < 100:
              raise SystemExit(f"Camera dataset looks incomplete: only {len(rows)} rows")
          for row in rows:
              lat, lon = float(row["latitude"]), float(row["longitude"])
              if not (40 <= lat <= 56 and 46 <= lon <= 88):
                  raise SystemExit(f"Out-of-country coordinate: {lat}, {lon}")
              if row.get("country_code") != "KZ":
                  raise SystemExit("Dataset contains a non-Kazakhstan record")
          print(f"Validated {len(rows)} Kazakhstan camera coordinates")
          PY

      - name: Generate Android platform files
        run: |
          cp pubspec.yaml /tmp/bake-pubspec.yaml
          cp lib/main.dart /tmp/bake-main.dart
          flutter create --platforms=android --org kz.bake --project-name bake_navigator --no-pub .
          # Remove the generated sample test: this app uses BakeNavigatorApp.
          rm -f test/widget_test.dart
          cp /tmp/bake-pubspec.yaml pubspec.yaml
          cp /tmp/bake-main.dart lib/main.dart

      - name: Configure Android SDK and NDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Keep the AGP, Kotlin and Gradle versions generated by this Flutter
          # SDK. Hard-coding older plugin versions breaks newer Flutter templates.
          settings = Path("android/settings.gradle")
          if not settings.exists():
              settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              raise SystemExit("Generated Android settings.gradle(.kts) was not found")
          # androidx.core 1.17.0 requires Android Gradle Plugin 8.9.1+.
          # Upgrade the generated app plugin and use its compatible Gradle wrapper.
          settings_content = settings.read_text()

          # Ensure plugin marker and transitive Kotlin artifacts can resolve
          # from Google's Maven repository and Maven Central, not only the
          # Gradle Plugin Portal.
          plugin_block = re.search(r"pluginManagement\s*\{([\s\S]*?)\n\}", settings_content)
          if not plugin_block:
              raise SystemExit("Generated pluginManagement block was not found")
          plugin_text = plugin_block.group(1)
          repositories_match = re.search(r"repositories\s*\{([^}]*)\}", plugin_text)
          if not repositories_match:
              raise SystemExit("Generated pluginManagement repositories block was not found")
          repositories_text = repositories_match.group(1)
          additions = []
          for repository in ("google()", "mavenCentral()", "gradlePluginPortal()"):
              if repository not in repositories_text:
                  additions.append("        " + repository)
          if additions:
              updated_repositories = repositories_text.rstrip() + "\n" + "\n".join(additions) + "\n      "
              plugin_text = plugin_text[:repositories_match.start(1)] + updated_repositories + plugin_text[repositories_match.end(1):]
              settings_content = settings_content[:plugin_block.start(1)] + plugin_text + settings_content[plugin_block.end(1):]

          settings_content, agp_count = re.subn(
              r'((?:id\(["\']com\.android\.application["\']\)|["\']com\.android\.application["\'])\s+version\s+["\'])8\.7\.3(["\'])',
              r'\g<1>8.9.1\g<2>',
              settings_content,
          )
          if agp_count != 1:
              raise SystemExit(
                  f"Expected one generated Android application plugin version 8.7.3, found {agp_count}"
              )

          # Valhalla's Kotlin artifacts are compiled with Kotlin metadata 2.3.0.
          # The Flutter 3.32.8 template uses Kotlin 2.1.0, which cannot read them.
          settings_content, kotlin_count = re.subn(
              r'((?:id\(["\']org\.jetbrains\.kotlin\.android["\']\)|["\']org\.jetbrains\.kotlin\.android["\'])\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.3.0\g<2>',
              settings_content,
          )
          if kotlin_count != 1:
              raise SystemExit(
                  f"Expected one generated Kotlin Android plugin version, found {kotlin_count}"
              )
          if "dependencyResolutionManagement" not in settings_content:
              settings_content += """
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          """
          else:
              dependency_block = re.search(r"dependencyResolutionManagement\s*\{([\s\S]*?)\n\}", settings_content)
              if not dependency_block:
                  raise SystemExit("Generated dependencyResolutionManagement block is malformed")
              dependency_text = dependency_block.group(1)
              repositories_block = re.search(r"repositories\s*\{([^}]*)\}", dependency_text)
              if not repositories_block:
                  dependency_text += "\n    repositories {\n        google()\n        mavenCentral()\n    }\n"
              else:
                  repo_text = repositories_block.group(1)
                  for repository in ("google()", "mavenCentral()"):
                      if repository not in repo_text:
                          repo_text += "\\n        " + repository
                  dependency_text = dependency_text[:repositories_block.start(1)] + repo_text + dependency_text[repositories_block.end(1):]
              settings_content = settings_content[:dependency_block.start(1)] + dependency_text + settings_content[dependency_block.end(1):]
          settings.write_text(settings_content)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("Generated Gradle wrapper properties were not found")
          wrapper_content = wrapper.read_text()
          wrapper_content, wrapper_count = re.subn(
              r"distributionUrl=.*gradle-[0-9.]+-(?:all|bin)\.zip",
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip",
              wrapper_content,
          )
          if wrapper_count != 1:
              raise SystemExit(
                  f"Expected one Gradle wrapper distribution URL, found {wrapper_count}"
              )
          wrapper.write_text(wrapper_content)
          print("Android Gradle Plugin upgraded to 8.9.1")
          print("Gradle wrapper upgraded to 8.11.1")

          app_gradle = Path("android/app/build.gradle")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle.kts")
          if not app_gradle.exists():
              raise SystemExit("Generated app Gradle file was not found")

          app_content = app_gradle.read_text()
          if app_gradle.suffix == ".kts":
              # Kotlin 2.3 requires compilerOptions on the top-level Kotlin
              # extension, not inside the Android DSL block.
              app_content, jvm_target_count = re.subn(
                  r"(?m)^\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*JavaVersion\.VERSION_11\.toString\(\)\s*\}\s*\n?",
                  "",
                  app_content,
                  count=1,
              )
              if jvm_target_count != 1:
                  raise SystemExit(
                      f"Expected one generated Kotlin jvmTarget setting, found {jvm_target_count}"
                  )
              if re.search(r"(?m)^kotlin\s*\{", app_content):
                  raise SystemExit("Unexpected existing top-level kotlin block")
              app_content = app_content.rstrip() + """
          
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
              }
          }
          """
          app_content, min_sdk_count = re.subn(
              r"minSdk\s*=\s*flutter\.minSdkVersion",
              "minSdk = 24",
              app_content,
          )
          if min_sdk_count != 1:
              raise SystemExit(
                  f"Expected one Flutter minSdk declaration, found {min_sdk_count}"
              )

          app_content, sdk_count = re.subn(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              app_content,
          )
          if sdk_count != 1:
              raise SystemExit(
                  f"Expected one Flutter compileSdk declaration, found {sdk_count}"
              )

          app_content, ndk_count = re.subn(
              r"ndkVersion\s*=\s*flutter\.ndkVersion",
              'ndkVersion = "29.0.14206865"',
              app_content,
          )
          if ndk_count != 1:
              raise SystemExit(
                  f"Expected one Flutter NDK version declaration, found {ndk_count}"
              )

          # Restrict packaged native libraries to the Samsung Galaxy A33's ARM64 ABI.
          # This filters transitive AAR .so files as well as Flutter plugin binaries.
          if re.search(r"(?m)^\s*abiFilters\b", app_content):
              raise SystemExit("Unexpected existing ABI filter; refusing to overwrite it")
          if app_gradle.suffix == ".kts":
              app_content, abi_count = re.subn(
                  r"(defaultConfig\s*\{)",
                  r'\1\n        ndk {\n            abiFilters += setOf("arm64-v8a")\n        }',
                  app_content,
                  count=1,
              )
          else:
              app_content, abi_count = re.subn(
                  r"(defaultConfig\s*\{)",
                  r"\1\n        ndk {\n            abiFilters 'arm64-v8a'\n        }",
                  app_content,
                  count=1,
              )
          if abi_count != 1:
              raise SystemExit(f"Expected one defaultConfig block for ABI filter, found {abi_count}")
          if "arm64-v8a" not in app_content:
              raise SystemExit("ARM64 ABI filter was not applied")
          print("Android native ABI filter: arm64-v8a only")

          app_gradle.write_text(app_content)
          print("Android compileSdk pinned to 36")
          print("Android NDK pinned to 29.0.14206865")
          PY

      - name: Add required Android permissions and app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permissions = [
              "INTERNET",
              "ACCESS_FINE_LOCATION",
              "ACCESS_COARSE_LOCATION",
              "ACCESS_BACKGROUND_LOCATION",
              "RECORD_AUDIO",
              "ACTIVITY_RECOGNITION",
              "FOREGROUND_SERVICE",
              "FOREGROUND_SERVICE_LOCATION",
              "FOREGROUND_SERVICE_MEDIA_PROJECTION",
              "POST_NOTIFICATIONS",
          ]
          # Add each permission independently. A pre-existing foreground GPS
          # permission must never prevent ACCESS_BACKGROUND_LOCATION being added.
          for permission in permissions:
              permission_name = f"android.permission.{permission}"
              if permission_name not in manifest:
                  line = f'    <uses-permission android:name="{permission_name}" />\n'
                  manifest = manifest.replace("    <application", line + "    <application", 1)
          manifest = manifest.replace('android:label="bake_navigator"', 'android:label="BAKE Navigator"')
          service = (
              '        <service android:name=".ScreenRecordingService" android:stopWithTask="false" '
              'android:exported="false" android:foregroundServiceType="mediaProjection" />\n'
          )
          if 'android:name=".ScreenRecordingService"' not in manifest:
              manifest = manifest.replace("    </application>", service + "    </application>", 1)
          path.write_text(manifest)
          PY

      - name: Verify offline map does not request shared-storage access
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml; then
            echo "::error::Offline MBTiles must not request broad shared-storage permissions."
            exit 1
          fi
          if grep -R -nE 'manageExternalStorage|Permission\\.storage|_requestSharedMbtilesAccess|_findSharedMbtilesFile' lib; then
            echo "::error::Shared-storage permission requests or full-storage scans remain in app code."
            exit 1
          fi
          if grep -n 'permission_handler:' pubspec.yaml; then
            echo "::error::permission_handler is no longer required for offline MBTiles."
            exit 1
          fi
          loader_calls="$(grep -c '_loadSavedOfflineMap();' lib/main.dart || true)"
          if [ "$loader_calls" -ne 1 ]; then
            echo "::error::Saved MBTiles may only load from the explicit offline-map button; found $loader_calls call sites."
            exit 1
          fi
          echo "Offline MBTiles uses the app-private directory and explicit user action only."

      - name: Install Valhalla offline routing and Flutter bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          # Flutter 3.32 generates Kotlin DSL by default. Support either Gradle DSL.
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          path = next((candidate for candidate in candidates if candidate.exists()), None)
          if path is None:
              raise SystemExit("Generated Android app Gradle file was not found")

          artifacts = [
              "io.github.rallista:valhalla-mobile:0.6.6",
              "io.github.rallista:valhalla-models:0.6.0",
              "io.github.rallista:valhalla-models-config:0.6.0",
              "com.stadiamaps:osrm-openapi:0.0.10",
              "androidx.appcompat:appcompat:1.7.0",
              "com.google.android.material:material:1.12.0",
              "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7",
          ]
          content = path.read_text()
          missing = [coordinate for coordinate in artifacts if coordinate not in content]
          if missing:
              if path.suffix == ".kts":
                  lines = [f'    implementation("{coordinate}")' for coordinate in missing]
              else:
                  lines = [f"    implementation '{coordinate}'" for coordinate in missing]
              # A separate dependencies block is valid Gradle and also works when
              # the current Flutter template contains no app-level block.
              content = content.rstrip() + "\n\ndependencies {\n" + "\n".join(lines) + "\n}\n"
              path.write_text(content)
          print(f"Valhalla dependencies configured in {path}")

          package_dir = Path("android/app/src/main/kotlin/kz/bake/bake_navigator")
          package_dir.mkdir(parents=True, exist_ok=True)
          bridge_source = Path("android-bridge/ValhallaRoutingBridge.kt")
          if not bridge_source.is_file():
              raise SystemExit("Checked-in Valhalla bridge source is missing")
          shutil.copy2(bridge_source, package_dir / "ValhallaRoutingBridge.kt")
          shutil.copy2(Path("android-bridge/ScreenRecordingService.kt"), package_dir / "ScreenRecordingService.kt")
          shutil.copy2(Path("android-bridge/ScreenRecordingBridge.kt"), package_dir / "ScreenRecordingBridge.kt")

          main_activity = package_dir / "MainActivity.kt"
          main_activity.write_text("""package kz.bake.bake_navigator

          import android.content.Intent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var valhallaBridge: ValhallaRoutingBridge? = null
              private var screenRecordingBridge: ScreenRecordingBridge? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  valhallaBridge = ValhallaRoutingBridge(
                      flutterEngine.dartExecutor.binaryMessenger,
                      applicationContext
                  )
                  screenRecordingBridge = ScreenRecordingBridge(
                      this,
                      flutterEngine.dartExecutor.binaryMessenger,
                      applicationContext
                  )
                  }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (screenRecordingBridge?.onActivityResult(requestCode, resultCode, data) != true) {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              override fun cleanUpFlutterEngine(flutterEngine: FlutterEngine) {
                  valhallaBridge?.close()
                  valhallaBridge = null
                  screenRecordingBridge?.close()
                  screenRecordingBridge = null
                  super.cleanUpFlutterEngine(flutterEngine)
              }
          }
          """)
      - name: Build embedded Shymkent offline vector map
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libboost-all-dev liblua5.3-dev lua5.3 libshp-dev libsqlite3-dev rapidjson-dev sqlite3
          git clone --depth 1 https://github.com/systemed/tilemaker.git /tmp/tilemaker
          make -C /tmp/tilemaker -j2
          jq '
            .settings.minzoom = 7
            | .settings.maxzoom = 17
            | .settings.basezoom = 17
            | .settings.combine_below = 14
            | .settings.name = "BAKE Navigator - Shymkent"
            | .settings.version = "1.0"
            | .settings.description = "Offline OpenStreetMap vector map for Shymkent"
            | .settings.filemetadata.attribution = "© OpenStreetMap contributors"
            | .layers |= with_entries(.value.maxzoom = 17)
            | .layers.housenumber.minzoom = 14
            | .layers.building.minzoom = 13
          ' /tmp/tilemaker/resources/config-openmaptiles.json > /tmp/config-shymkent.json
          mkdir -p assets/data
          /tmp/tilemaker/tilemaker \
            --bbox 69.35,42.12,69.90,42.53 \
            --input shymkent-search.osm.pbf \
            --output assets/data/shymkent.mbtiles \
            --config /tmp/config-shymkent.json \
            --process /tmp/tilemaker/resources/process-openmaptiles.lua \
            --store /tmp/tilemaker-shymkent-store \
            --threads 2
          sqlite3 assets/data/shymkent.mbtiles "PRAGMA integrity_check;" | grep -qx ok
          test "$(sqlite3 assets/data/shymkent.mbtiles 'SELECT COUNT(*) FROM tiles;')" -gt 0
          test "$(sqlite3 assets/data/shymkent.mbtiles "SELECT value FROM metadata WHERE name='format';")" = "pbf"
          ls -lh assets/data/shymkent.mbtiles
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pubspec.yaml")
          content = path.read_text()
          marker = "    - assets/data/shymkent_search.json.gz"
          if content.count(marker) != 1:
              raise SystemExit("Could not register the generated Shymkent map asset")
          if "assets/data/shymkent.mbtiles" not in content:
              content = content.replace(marker, marker + "\n    - assets/data/shymkent.mbtiles")
          path.write_text(content)
          print("Embedded Shymkent MBTiles registered in Flutter assets")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Save resolved dependency versions
        uses: actions/upload-artifact@v4
        with:
          name: BAKE-NAVIGATOR-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          clean_define() {
            printf '%s' "$1" | tr -d '\r\n'
          }
          supabase_url="$(clean_define "${SUPABASE_URL:-}")"
          supabase_key="$(clean_define "${SUPABASE_ANON_KEY:-}")"
          printf 'Supabase URL configured: %s\n' "$([ -n "$supabase_url" ] && echo yes || echo no)"
          printf 'Supabase key configured: %s\n' "$([ -n "$supabase_key" ] && echo yes || echo no)"
          # Package only modern 64-bit Android devices to keep the release APK compact.
          flutter build apk --release --target-platform android-arm64 --dart-define=SUPABASE_URL="$supabase_url" --dart-define=SUPABASE_ANON_KEY="$supabase_key"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BAKE-NAVIGATOR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bake-navigator-${{ github.run_number }}
          name: BAKE Navigator ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
