name: Build BAKE Navigator APK

on:
  workflow_dispatch:
  push:
    branches:
      - navigator-ui-work
      - valhalla-bridge-prep

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          cp pubspec.yaml /tmp/bake-pubspec.yaml
          cp lib/main.dart /tmp/bake-main.dart
          flutter create --platforms=android --org kz.bake --project-name bake_navigator --no-pub .
          # Remove the generated sample test: this app uses BakeNavigatorApp.
          rm -f test/widget_test.dart
          cp /tmp/bake-pubspec.yaml pubspec.yaml
          cp /tmp/bake-main.dart lib/main.dart

      - name: Set Android Gradle, Kotlin and NDK versions for MapLibre and Valhalla
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          if not settings.exists():
              settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              raise SystemExit("Generated Android settings.gradle(.kts) was not found")

          content = settings.read_text()
          updates = [
              (
                  r'(id\s*\(?\s*["\']com\.android\.application["\']\s*\)?\s+version\s+["\'])8\.1\.0(["\'])',
                  "8.6.1",
                  "Android Gradle Plugin",
              ),
              (
                  r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s+version\s+["\'])1\.8\.22(["\'])',
                  "2.2.10",
                  "Kotlin Gradle Plugin",
              ),
          ]
          for pattern, version, label in updates:
              content, count = re.subn(pattern, lambda m: m.group(1) + version + m.group(2), content)
              if count != 1:
                  raise SystemExit(f"Expected exactly one supported {label} version to update; found {count}")
              print(f"{label} updated to {version}")
          settings.write_text(content)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("Gradle wrapper properties were not generated")
          wrapper_content = wrapper.read_text()
          wrapper_content, count = re.subn(
              r"gradle-[0-9.]+-(?:all|bin)\.zip",
              "gradle-8.7-all.zip",
              wrapper_content,
          )
          if count != 1:
              raise SystemExit(f"Expected one Gradle distribution URL, found {count}")
          wrapper.write_text(wrapper_content)
          print("Gradle wrapper updated to 8.7")

          app_gradle = Path("android/app/build.gradle")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle.kts")
          if not app_gradle.exists():
              raise SystemExit("Generated app Gradle file was not found")
          app_content = app_gradle.read_text()
          app_content, count = re.subn(
              r"ndkVersion\s*=\s*flutter\.ndkVersion",
              'ndkVersion = "28.1.13356709"',
              app_content,
          )
          if count != 1:
              raise SystemExit(f"Expected one Flutter NDK version declaration, found {count}")
          app_gradle.write_text(app_content)
          print("Android NDK pinned to 28.1.13356709")
          PY

      - name: Add required Android permissions and app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permissions = (
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )
          if 'android.permission.ACCESS_FINE_LOCATION' not in manifest:
              manifest = manifest.replace("    <application", permissions + "    <application", 1)
          manifest = manifest.replace('android:label="bake_navigator"', 'android:label="BAKE Navigator"')
          path.write_text(manifest)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Save resolved dependency versions
        uses: actions/upload-artifact@v4
        with:
          name: BAKE-NAVIGATOR-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BAKE-NAVIGATOR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
