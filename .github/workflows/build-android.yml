name: Build BAKE Navigator Kotlin APK

on:
  push:
    branches:
      - experiment/maplibre-kotlin
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kotlin-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/maplibre-kotlin

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native Android debug APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload Kotlin APK
        uses: actions/upload-artifact@v4
        with:
          name: BAKE-Navigator-Kotlin-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
